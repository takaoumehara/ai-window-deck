<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AI Window Deck</title>
    <link rel="stylesheet" href="deck.css">
  </head>
  <body class="as-popup">
    <div class="page">
      <header>
        <span class="orb" aria-hidden="true"></span>
        <div class="title"><h1>AI Window Deck</h1><p data-i18n="tagline"></p></div>
        <div class="header-right-tools">
          <button id="openBig" type="button" class="btn-open-big-top">↗ 大画面で開く</button>
          <label class="lang">
            <span class="visually-hidden" data-i18n="language"></span>
            <select id="language"></select>
          </label>
        </div>
      </header>

      <div class="deck-head">
        <h2 class="bar-title"><span data-i18n="sec_commands"></span></h2>
        <button type="button" class="info" data-i18n-label="help_label" aria-expanded="false" aria-controls="help_actions">i</button>
        <button id="fullscreen" class="pop-out" data-i18n="fullscreen" hidden></button>
      </div>
      <p class="help" id="help_actions" data-i18n="help_actions" hidden></p>

      <div class="deck-actions-container">
        <!-- Primary Commands (Hero 2x Height Row: Spotlight & Tile Restore) -->
        <div class="deck-actions-primary">
          <button id="spotlight" class="cmd-hero primary">
            <span class="glyph" aria-hidden="true">◫</span>
            <span class="stack"><b data-i18n="act_spotlight"></b><small class="keys" id="spotlightKeys"></small></span>
          </button>
          <button id="home" class="cmd-hero primary-alt">
            <span class="glyph" aria-hidden="true">⌂</span>
            <span class="stack"><b data-i18n="act_home"></b><small class="keys" id="homeKeys"></small></span>
          </button>
        </div>

        <!-- Secondary Commands (Compact & Uniform Height Row) -->
        <div class="deck-actions-secondary">
          <button id="prev" class="cmd-sub">
            <span class="glyph" aria-hidden="true">←</span>
            <span class="stack"><b data-i18n="act_prev"></b><small class="keys" id="prevKeys"></small></span>
          </button>
          <button id="next" class="cmd-sub">
            <span class="glyph" aria-hidden="true">→</span>
            <span class="stack"><b data-i18n="act_next"></b><small class="keys" id="nextKeys"></small></span>
          </button>
          <button id="retile" class="cmd-sub">
            <span class="glyph" aria-hidden="true">▦</span>
            <span class="stack"><b data-i18n="act_tile"></b><small class="keys" id="tileKeys"></small></span>
          </button>
          <button id="launch" class="cmd-sub">
            <span class="glyph" aria-hidden="true">⊞</span>
            <span class="stack"><b data-i18n="launch"></b><small class="keys"></small></span>
          </button>
          <button id="undo" class="cmd-sub">
            <span class="glyph" aria-hidden="true">↺</span>
            <span class="stack"><b data-i18n="undo"></b><small class="keys" id="undoKeys"></small></span>
          </button>
          <button id="fullscreenWindow" class="cmd-sub">
            <span class="glyph" aria-hidden="true">⤢</span>
            <span class="stack"><b data-i18n="act_fullscreen"></b><small class="keys" id="fullscreenKeys"></small></span>
          </button>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button role="tab" id="tab-arrange" aria-controls="panel-arrange" aria-selected="true" data-i18n="tab_arrange"></button>
        <button role="tab" id="tab-resize" aria-controls="panel-resize" aria-selected="false" data-i18n="tab_resize"></button>
        <button role="tab" id="tab-windows" aria-controls="panel-windows" aria-selected="false" data-i18n="tab_windows"></button>
      </div>

      <div class="scroll">
        <section id="panel-arrange" role="tabpanel" aria-labelledby="tab-arrange">
          <!-- Hidden Legacy Saved Arrangements -->
          <div class="card" id="legacyPresetCard" style="display:none;">
            <select id="presetSelect"></select>
            <input id="presetName" class="preset-name" type="text" hidden>
            <button id="presetNew" class="tool"></button>
            <button id="presetRename" class="tool"></button>
            <button id="presetDelete" class="tool"></button>
          </div>

          <div class="flow">
            <!-- Screen 1 / Screen 2 / Screen 3 Selector Cards (Wireframe Image 1 & 2) -->
            <div class="card step screen-selector-card">
              <h2>Select which monitors to open browser windows.</h2>
              <p class="sidebar-hint" style="margin-bottom: 8px;">You can select multiple monitors</p>
              <div class="screens-grid" id="screensGrid"></div>
              <label class="check" style="margin-top: 10px;"><input type="checkbox" id="sameDisplayOnly"><span><span data-i18n="same_display_only"></span></span></label>
            </div>
          </div>

          <!-- Main Integrated Workspace: Left Windows Library + Right Workspace Canvas (Wireframe Image 2) -->
          <div class="workspace-layout">
            <!-- Left Panel: Windows Library -->
            <aside class="windows-sidebar">
              <div class="sidebar-header">
                <h3>Windows</h3>
                <button id="btnOpenRegisterModal" type="button" class="btn-add-icon" title="新規ウィンドウを登録">＋</button>
              </div>
              <p class="sidebar-hint">double click to edit</p>
              <div class="windows-list" id="libraryTray"></div>
            </aside>

            <!-- Right Panel: Screen Canvas & Browser Grid -->
            <main class="workspace-main">
              <div class="workspace-toolbar">
                <div class="browser-count-adjuster">
                  <span data-i18n="how_many_browsers">how many browsers</span>
                  <button id="btnSlotDec" type="button" class="step-btn">-</button>
                  <input type="number" id="slotCountInput" class="count-input" min="1" max="16" value="8">
                  <button id="btnSlotInc" type="button" class="step-btn">+</button>
                </div>

                <div class="workspace-actions">
                  <!-- Layout Dropdown Selector (Image 4 & 5) -->
                  <div class="layout-dropdown-container" id="layoutDropdownContainer">
                    <button id="btnLayoutPicker" type="button" class="layout-picker-btn">
                      <span>🗂 STANDARD <b id="currentLayoutName">layout A</b></span>
                      <small>▼</small>
                    </button>
                    <div class="layout-dropdown-menu" id="layoutDropdownMenu" hidden>
                      <div class="layout-list" id="layoutList"></div>
                      <button id="btnCreateNewLayout" type="button" class="btn-create-new-layout" data-i18n="btn_create_new_layout">＋ 新しいウィンドウレイアウトを作成</button>
                    </div>
                  </div>

                  <button id="btnEqualize" type="button" class="tool-sm" data-i18n="btn_equalize"></button>
                  <button id="btnCanvasUndo" type="button" class="tool-sm" data-i18n="btn_undo_canvas"></button>
                  <button id="btnCanvasClear" type="button" class="tool-sm danger" data-i18n="btn_clear_canvas"></button>
                  <button id="btnLaunchSelected" type="button" class="primary-sm" data-i18n="btn_launch_selected"></button>
                </div>
              </div>

              <!-- Main Screen Outer Frame -->
              <div class="screen-frame-container" id="launchCanvas">
                <p class="canvas-empty-hint" id="canvasEmptyHint" data-i18n="canvas_empty_hint"></p>
                <div class="canvas-grid" id="canvasGrid"></div>
              </div>
            </main>
          </div>

          <!-- Hidden Legacy Details Container for Custom Grid compatibility -->
          <details class="sub" style="display:none;">
            <summary data-i18n="layout_custom"></summary>
            <input id="cols" type="range" min="1" max="6" value="4">
            <input id="rows" type="range" min="1" max="4" value="2">
            <div id="shapes"></div>
            <div id="displayMap"></div>
            <div id="slots"></div>
            <textarea id="bulkText"></textarea>
            <button id="bulkApply"></button>
            <button id="bulkAppend"></button>
          </details>
        </section>

        <section id="panel-resize" role="tabpanel" aria-labelledby="tab-resize" hidden>
          <div class="card">
            <h2><span data-i18n="spotlight_size"></span><button type="button" class="info" data-i18n-label="help_label" aria-expanded="false" aria-controls="help_size">i</button></h2>
            <p class="help" id="help_size" data-i18n="help_size" hidden></p>
            <div class="sizes" id="sizes" role="radiogroup" data-i18n-label="spotlight_size"></div>
            <div id="customSize" hidden>
              <label class="row" for="spotlightWidth"><span data-i18n="width"></span><output id="widthValue">70%</output></label>
              <input id="spotlightWidth" type="range" min="20" max="100" step="5" value="70">
              <label class="row" for="spotlightHeight"><span data-i18n="height"></span><output id="heightValue">90%</output></label>
              <input id="spotlightHeight" type="range" min="20" max="100" step="5" value="90">
            </div>
          </div>

          <div class="card" id="anchorCard">
            <h2><span data-i18n="anchor"></span><button type="button" class="info" data-i18n-label="help_label" aria-expanded="false" aria-controls="help_anchor">i</button></h2>
            <p class="help" id="help_anchor" data-i18n="help_anchor" hidden></p>
            <fieldset>
              <legend class="visually-hidden" data-i18n="anchor"></legend>
              <div class="options">
                <label><input type="radio" name="anchor" value="keep"><span data-i18n="anchor_keep"></span></label>
                <label><input type="radio" name="anchor" value="center"><span data-i18n="anchor_center"></span></label>
              </div>
            </fieldset>
          </div>
        </section>

        <section id="panel-windows" role="tabpanel" aria-labelledby="tab-windows" hidden>
          <!-- Section 1: Global Registered Windows Library -->
          <div class="card" id="registeredWindowsCard">
            <h2><span data-i18n="sec_registered_windows">登録済みウィンドウ</span> <button id="btnOpenRegisterModal2" type="button" class="btn-add-icon-sm" title="新規ウィンドウを登録">＋ 新規追加</button></h2>
            <div class="registered-windows-full-list" id="registeredWindowsList"></div>
          </div>

          <!-- Section 2: Currently Open Browser Windows -->
          <div class="card" id="openWindowsCard">
            <h2><span data-i18n="sec_open_windows"></span><button type="button" class="info" data-i18n-label="help_label" aria-expanded="false" aria-controls="help_windows">i</button></h2>
            <p class="help" id="help_windows" data-i18n="help_windows" hidden></p>
            <p class="hint" data-i18n="dock_hint"></p>
            <div class="list-tools">
              <button id="openDock" data-i18n="open_dock"></button>
              <button id="closeAll" class="tool" data-i18n="close_all"></button>
            </div>
            <div class="window-list" id="windowList"></div>
          </div>
        </section>

        <div class="card common">
          <h2><span data-i18n="sec_shortcuts"></span><button type="button" class="info" data-i18n-label="help_label" aria-expanded="false" aria-controls="help_shortcuts">i</button></h2>
            <p class="help" id="help_shortcuts" data-i18n="help_shortcuts" hidden></p>
          <dl id="shortcutList"></dl>
          <p class="hint" data-i18n="help_rotate"></p>
          <p class="hint" data-i18n="help_fullscreen"></p>
          <p class="hint" data-i18n="shortcut_hint"></p>
          <button id="editShortcuts" data-i18n="change_shortcuts"></button>
        </div>

        <div class="card danger-zone">
          <h2 class="danger-title">⚠️ <span data-i18n="sec_danger_zone">Danger Zone</span></h2>
          <p class="hint" data-i18n="danger_reset_hint">Reset all saved window decks, layouts, and configurations to factory defaults.</p>
          <button id="btnFactoryReset" type="button" class="btn-danger-reset" data-i18n="btn_factory_reset">Reset All Data & Settings</button>
        </div>

      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>

    <!-- Modal: Register a window / Bulk Create with text (Wireframe Image 3) -->
    <div class="modal-overlay" id="registerModal" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <button id="modalBackBtn" type="button" class="modal-back-btn" hidden>←</button>
          <h2 id="modalTitle" data-i18n="register_window_title">Register a window</h2>
          <button id="modalCloseBtn" type="button" class="modal-close-btn">✕</button>
        </div>
        
        <!-- Mode A: Single Window Register -->
        <div class="modal-body" id="modalSingleBody">
          <input type="text" id="regWindowName" class="modal-input" placeholder="Window name" data-i18n-placeholder="window_name_placeholder">
          <div class="url-inputs-list" id="regUrlList">
            <div class="url-input-row">
              <input type="url" class="modal-input reg-url" placeholder="https://..." spellcheck="false">
              <button type="button" class="btn-remove-url-row" title="Delete URL">✕</button>
            </div>
            <div class="url-input-row">
              <input type="url" class="modal-input reg-url" placeholder="https://..." spellcheck="false">
              <button type="button" class="btn-remove-url-row" title="Delete URL">✕</button>
              <button id="btnAddUrlRow" type="button" class="btn-add-url">＋</button>
            </div>
          </div>
          
          <div class="modal-actions">
            <button id="btnRegClear" type="button" class="tool" data-i18n="btn_clear">Clear</button>
            <button id="btnRegSubmit" type="button" class="primary" data-i18n="btn_register_window">Register this window</button>
          </div>

          <div class="modal-divider"><span data-i18n="or_word">Or</span></div>

          <button id="btnSwitchToBulk" type="button" class="tool-block" data-i18n="btn_bulk_create">Bulk create with text / file</button>
        </div>

        <!-- Mode B: Bulk Create with text / File Import/Export -->
        <div class="modal-body" id="modalBulkBody" hidden>
          <div class="bulk-file-tools">
            <button id="btnExportTxt" type="button" class="tool-sm">📥 Export to File (.txt)</button>
            <button id="btnImportTxt" type="button" class="tool-sm">📤 Import from File (.txt)</button>
            <input type="file" id="fileImportInput" accept=".txt,.json" hidden>
          </div>

          <textarea id="modalBulkText" class="modal-textarea" rows="12" spellcheck="false" placeholder="Window Name&#10;https://example.com/1&#10;https://example.com/2&#10;&#10;Second Window&#10;https://example.com/3"></textarea>
          
          <div class="modal-actions">
            <button id="btnBulkClear" type="button" class="tool" data-i18n="btn_clear">Clear</button>
            <button id="btnBulkSubmit" type="button" class="primary" data-i18n="btn_register_window">Register All Windows</button>
          </div>
        </div>
      </div>
    </div>

    <script src="strings.js"></script>
    <script src="keys.js"></script>
    <script src="i18n.js"></script>
    <script src="layout-model.js"></script>
    <script src="deck.js"></script>
  </body>
</html>
