name: Desktop app (macOS)

# Pull requests build an unsigned .dmg to prove the Mac build works.
# Manual runs and desktop-v* tags sign with the Developer ID certificate and
# notarize, once these repository secrets exist:
#   MAC_CERT_P12_BASE64         Developer ID Application certificate (.p12), base64
#   MAC_CERT_PASSWORD           password chosen when exporting the .p12
#   APPLE_ID                    Apple Account email of the developer team
#   APPLE_APP_SPECIFIC_PASSWORD app-specific password from account.apple.com
#   APPLE_TEAM_ID               10-character team ID from developer.apple.com/account
on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-mac.yml"
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm test

      # electron-builder's own CSC_LINK import passes the .p12 password to
      # set-key-partition-list instead of its random keychain password, which
      # fails, so the certificate goes into a keychain made here instead.
      - name: Build .dmg
        env:
          SIGN: ${{ github.event_name != 'pull_request' }}
          CERT_P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$SIGN" != "true" ] || [ -z "$CERT_P12" ]; then
            echo "Building unsigned (no certificate, or a pull request build)."
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          else
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password="$(openssl rand -base64 32)"
            echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"
            security find-identity -v -p codesigning "$keychain"
          fi
          npm run build
          npx electron-builder --mac --publish never

      - name: Check signature and notarization
        if: github.event_name != 'pull_request'
        env:
          HAS_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
        run: |
          app="$(find release -maxdepth 2 -name '*.app' -type d | head -n 1)"
          if [ "$HAS_CERT" != "true" ]; then
            echo "::warning::No certificate secret, so this build is unsigned."
            exit 0
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Window-Deck-mac
          path: desktop/release/*.dmg
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg --title "AI Window Deck desktop ${GITHUB_REF_NAME#desktop-v}" --generate-notes --prerelease
