<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>AI Window Deck — Design System & Component Preview</title>
  <style>
    body { font-family: Inter, sans-serif; background: #0B0E14; color: #E8ECF3; padding: 24px; }
    h1 { color: #8AA4FF; }
    .swatch-group { display: flex; gap: 12px; margin-bottom: 24px; }
    .swatch { width: 100px; height: 60px; border-radius: 8px; display: flex; align-items: flex-end; padding: 8px; font-size: 11px; font-weight: 600; }
    .btn-preview { padding: 8px 16px; border-radius: 6px; border: none; background: #2F5BFF; color: #fff; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <h1>AI Window Deck Design System</h1>
  <p>Visual tokens and interactive component previews for Superforge UI engine.</p>
  
  <h2>Color Palette</h2>
  <div class="swatch-group">
    <div class="swatch" style="background:#0B0E14; border:1px solid #333;">Ground #0B0E14</div>
    <div class="swatch" style="background:#151B27;">Card #151B27</div>
    <div class="swatch" style="background:#1B2331;">Raised #1B2331</div>
    <div class="swatch" style="background:#8AA4FF; color:#000;">Accent #8AA4FF</div>
    <div class="swatch" style="background:#2F5BFF;">Fill #2F5BFF</div>
  </div>

  <h2>Button Components</h2>
  <button class="btn-preview">⚡ Launch Selected Windows</button>
</body>
</html>
